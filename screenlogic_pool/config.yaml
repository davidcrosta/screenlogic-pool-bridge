name: ScreenLogic Pool Bridge
version: "1.0.3"
slug: screenlogic_pool
description: Remote ScreenLogic pool equipment and optional lighting controls
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
hassio_api: true
services: [mqtt:need]
options:
  allow_control: false
  pools: []
schema:
  allow_control: bool
  pools:
    - id: str
      system_name: str
      password: password
      pool_circuit: int(1,255)
      pump_id: int(1,8)
      pool_light_circuit: int(1,255)?
      spa_light_circuit: int(1,255)?
  lighting_latitude: float(-90,90)?
  lighting_longitude: float(-180,180)?
  lighting_time_zone: str?
