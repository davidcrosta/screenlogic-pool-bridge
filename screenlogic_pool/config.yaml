name: ScreenLogic Pool Bridge
version: "1.0.0"
slug: screenlogic_pool
description: Remote pool-only ScreenLogic connection using node-screenlogic
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
hassio_api: true
services: [mqtt:need]
options:
  allow_control: false
  pools: []
schema:
  allow_control: bool
  pools:
    - id: str
      system_name: str
      password: password
      pool_circuit: int(1,255)
      pump_id: int(1,8)
